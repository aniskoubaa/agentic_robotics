# Joystick teleop config for the RAISE 2026 Husky.
# Defaults match a standard Xbox / generic gamepad layout via teleop_twist_joy.
#
# Stick / button mapping:
#   left stick vertical    → linear.x   (forward / backward)
#   right stick horizontal → angular.z  (turn left / right)
#   A button (idx 0)       → "enable" — hold to drive (deadman)
#   B button (idx 1)       → "turbo"  — hold for 3× speed
#
# To change mapping for a different controller (PS4, etc.) just tweak the
# axis / button indices below.

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.5

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 2.0

    enable_button: 0
    enable_turbo_button: 1
    require_enable_button: true
